<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sun-fill" x2="0" y2="1"><stop stop-color="#ffe591"/><stop offset="1" stop-color="#ffb545"/></linearGradient>
    <linearGradient id="cloud-fill" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#bcd2e9"/></linearGradient>
    <g id="sun-shape"><g stroke="#f6b834" stroke-width="4" stroke-linecap="round"><path d="M64 10v9m0 90v9M10 64h9m90 0h9M26 26l7 7m62 62 7 7M26 102l7-7m62-62 7-7"/></g><circle cx="64" cy="64" r="30" fill="url(#sun-fill)"/></g>
    <path id="cloud-shape" d="M31 96a23 23 0 0 1-1-46 31 31 0 0 1 59 4 21 21 0 1 1 9 42Z" fill="url(#cloud-fill)" stroke="#c4d5e8" stroke-width="1.5"/>
    <g id="moon-shape"><path d="M88 91A43 43 0 0 1 44 20a43 43 0 1 0 44 71Z" fill="#d9e7ff"/><path d="m97 21 2 7 7 2-7 2-2 7-2-7-7-2 7-2Z" fill="#f5d98d"/></g>
    <g id="rain-lines" stroke="#4b9fe1" stroke-width="5" stroke-linecap="round"><path d="m43 102-5 10m30-10-5 10m30-10-5 10"/></g>
  </defs>
  <symbol id="sun" viewBox="0 0 128 128"><use href="#sun-shape"/></symbol>
  <symbol id="moon" viewBox="0 0 128 128"><use href="#moon-shape"/></symbol>
  <symbol id="cloud" viewBox="0 0 128 128"><use href="#cloud-shape"/></symbol>
  <symbol id="sun-cloud" viewBox="0 0 128 128"><use href="#sun-shape" transform="translate(18 -7) scale(.78)"/><use href="#cloud-shape" transform="translate(-1 6)"/></symbol>
  <symbol id="moon-cloud" viewBox="0 0 128 128"><use href="#moon-shape" transform="translate(26 -10) scale(.75)"/><use href="#cloud-shape" transform="translate(-1 6)"/></symbol>
  <symbol id="rain" viewBox="0 0 128 128"><use href="#cloud-shape" transform="translate(0 -9)"/><use href="#rain-lines"/></symbol>
  <symbol id="snow" viewBox="0 0 128 128"><use href="#cloud-shape" transform="translate(0 -10)"/><g fill="#67a7c8"><circle cx="38" cy="106" r="4"/><circle cx="67" cy="111" r="4"/><circle cx="95" cy="105" r="4"/></g></symbol>
  <symbol id="storm" viewBox="0 0 128 128"><use href="#cloud-shape" transform="translate(0 -10)"/><path d="m68 79-17 25h14l-8 20 27-31H70l9-14Z" fill="#f5b53c"/></symbol>
  <symbol id="fog" viewBox="0 0 128 128"><use href="#cloud-shape" transform="translate(0 -13)"/><path d="M19 95h92M26 106h76M38 117h53" stroke="#9aaec5" stroke-width="5" stroke-linecap="round"/></symbol>
